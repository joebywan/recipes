<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="355" viewBox="0 0 1267 355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<title>Red Lentil Protein Brownies: engineer's chart</title>
<style>
.bg{fill:#ffffff}.title{fill:#2c2c2a;font-weight:600}
.mat{fill:#f7f6f1;stroke:#d3d1c7}.act{fill:#fbf3e6;stroke:#e6b873}
.edge{fill:none;stroke:#8a877c;stroke-width:1.5}
text{fill:#2c2c2a}.amt{fill:#5f5e5a}
@media (prefers-color-scheme: dark){
.bg{fill:#1d1d1b}.title{fill:#ecebe6}
.mat{fill:#2a2a27;stroke:#4a4944}.act{fill:#3a2f1e;stroke:#9a7436}
.edge{stroke:#8a877c}text{fill:#ecebe6}.amt{fill:#b4b2a9}}
</style>
<rect class="bg" width="1267" height="355"/>
<text class="title" x="8" y="15.5" dominant-baseline="central" font-size="15">Red Lentil Protein Brownies</text>
<rect class="mat" x="0.0" y="31.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="45.5" dominant-baseline="central">100 g</text>
<rect class="mat" x="64.9" y="31.0" width="169.9" height="29.0"/>
<text x="72.9" y="45.5" dominant-baseline="central">Red lentils</text>
<rect class="mat" x="0.0" y="60.0" width="64.9" height="34.0"/>
<text class="amt" x="8.0" y="77.0" dominant-baseline="central">250 ml</text>
<rect class="mat" x="64.9" y="60.0" width="169.9" height="34.0"/>
<text x="72.9" y="77.0" dominant-baseline="central">Water</text>
<rect class="mat" x="0.0" y="94.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="108.5" dominant-baseline="central">2</text>
<rect class="mat" x="64.9" y="94.0" width="391.8" height="29.0"/>
<text x="72.9" y="108.5" dominant-baseline="central">Eggs</text>
<rect class="mat" x="0.0" y="123.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="137.5" dominant-baseline="central">2 tsp</text>
<rect class="mat" x="64.9" y="123.0" width="391.8" height="29.0"/>
<text x="72.9" y="137.5" dominant-baseline="central">Vanilla</text>
<rect class="mat" x="0.0" y="152.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="166.5" dominant-baseline="central">30 g</text>
<rect class="mat" x="64.9" y="152.0" width="524.5" height="29.0"/>
<text x="72.9" y="166.5" dominant-baseline="central">Cocoa</text>
<rect class="mat" x="0.0" y="181.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="195.5" dominant-baseline="central">30 g</text>
<rect class="mat" x="64.9" y="181.0" width="524.5" height="29.0"/>
<text x="72.9" y="195.5" dominant-baseline="central">Chocolate whey</text>
<rect class="mat" x="0.0" y="210.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="224.5" dominant-baseline="central">2 tbsp</text>
<rect class="mat" x="64.9" y="210.0" width="524.5" height="29.0"/>
<text x="72.9" y="224.5" dominant-baseline="central">Powdered peanut butter</text>
<rect class="mat" x="0.0" y="239.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="253.5" dominant-baseline="central">3 tbsp</text>
<rect class="mat" x="64.9" y="239.0" width="524.5" height="29.0"/>
<text x="72.9" y="253.5" dominant-baseline="central">Monkfruit sweetener</text>
<rect class="mat" x="0.0" y="268.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="282.5" dominant-baseline="central">1 tsp</text>
<rect class="mat" x="64.9" y="268.0" width="524.5" height="29.0"/>
<text x="72.9" y="282.5" dominant-baseline="central">Baking powder</text>
<rect class="mat" x="0.0" y="297.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="311.5" dominant-baseline="central">½ tsp</text>
<rect class="mat" x="64.9" y="297.0" width="524.5" height="29.0"/>
<text x="72.9" y="311.5" dominant-baseline="central">Salt</text>
<rect class="mat" x="0.0" y="326.0" width="64.9" height="29.0"/>
<text class="amt" x="8.0" y="340.5" dominant-baseline="central">40 g</text>
<rect class="mat" x="64.9" y="326.0" width="678.6" height="29.0"/>
<text x="72.9" y="340.5" dominant-baseline="central">Dark chocolate chips</text>
<rect class="act" x="234.8" y="31.0" width="221.9" height="63.0"/>
<text x="242.8" y="45.5" dominant-baseline="central">Rinse until the water runs clear</text>
<text x="242.8" y="62.5" dominant-baseline="central">Simmer ~15 min until mushy</text>
<text x="242.8" y="79.5" dominant-baseline="central">Drain, rinse again, drain well</text>
<rect class="act" x="456.7" y="31.0" width="132.7" height="121.0"/>
<text x="464.7" y="91.5" dominant-baseline="central">Blitz until smooth</text>
<rect class="act" x="589.4" y="31.0" width="154.1" height="295.0"/>
<text x="597.4" y="178.5" dominant-baseline="central">Blitz to a thick batter</text>
<rect class="act" x="743.5" y="31.0" width="254.2" height="324.0"/>
<text x="751.5" y="193.0" dominant-baseline="central">Fold in, save a few chips for the top</text>
<rect class="act" x="997.8" y="31.0" width="269.1" height="324.0"/>
<text x="1005.8" y="167.5" dominant-baseline="central">Spread in lined 20 cm</text>
<text x="1005.8" y="184.5" dominant-baseline="central">tin, ~20 mm deep</text>
<text x="1005.8" y="201.5" dominant-baseline="central">Bake 180 °C fan ~22 min until just set</text>
<text x="1005.8" y="218.5" dominant-baseline="central">Cool, chill, slice into 9</text>
<rect class="edge" x="0.75" y="0.75" width="1265.4" height="353.5"/>
</svg>
