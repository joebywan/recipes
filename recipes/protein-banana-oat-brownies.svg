<svg xmlns="http://www.w3.org/2000/svg" width="930" height="292" viewBox="0 0 930 292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<title>Protein Banana-Oat Brownies: engineer's chart</title>
<style>
.bg{fill:#ffffff}.title{fill:#2c2c2a;font-weight:600}
.mat{fill:#f7f6f1;stroke:#d3d1c7}.act{fill:#fbf3e6;stroke:#e6b873}
.edge{fill:none;stroke:#8a877c;stroke-width:1.5}
text{fill:#2c2c2a}.amt{fill:#5f5e5a}
@media (prefers-color-scheme: dark){
.bg{fill:#1d1d1b}.title{fill:#ecebe6}
.mat{fill:#2a2a27;stroke:#4a4944}.act{fill:#3a2f1e;stroke:#9a7436}
.edge{stroke:#8a877c}text{fill:#ecebe6}.amt{fill:#b4b2a9}}
</style>
<rect class="bg" width="930" height="292"/>
<text class="title" x="8" y="15.5" dominant-baseline="central" font-size="15">Protein Banana-Oat Brownies</text>
<rect class="mat" x="0.0" y="31.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="45.5" dominant-baseline="central">60 g</text>
<rect class="mat" x="51.5" y="31.0" width="182.2" height="29.0"/>
<text x="59.5" y="45.5" dominant-baseline="central">Rolled oats</text>
<rect class="mat" x="0.0" y="60.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="74.5" dominant-baseline="central">2</text>
<rect class="mat" x="51.5" y="60.0" width="285.7" height="29.0"/>
<text x="59.5" y="74.5" dominant-baseline="central">Very ripe bananas</text>
<rect class="mat" x="0.0" y="89.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="103.5" dominant-baseline="central">30 g</text>
<rect class="mat" x="51.5" y="89.0" width="285.7" height="29.0"/>
<text x="59.5" y="103.5" dominant-baseline="central">Chocolate protein powder</text>
<rect class="mat" x="0.0" y="118.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="132.5" dominant-baseline="central">20 g</text>
<rect class="mat" x="51.5" y="118.0" width="285.7" height="29.0"/>
<text x="59.5" y="132.5" dominant-baseline="central">Cocoa</text>
<rect class="mat" x="0.0" y="147.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="161.5" dominant-baseline="central">1 + 1</text>
<rect class="mat" x="51.5" y="147.0" width="285.7" height="29.0"/>
<text x="59.5" y="161.5" dominant-baseline="central">Egg + egg white</text>
<rect class="mat" x="0.0" y="176.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="190.5" dominant-baseline="central">150 g</text>
<rect class="mat" x="51.5" y="176.0" width="285.7" height="29.0"/>
<text x="59.5" y="190.5" dominant-baseline="central">Greek yoghurt</text>
<rect class="mat" x="0.0" y="205.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="219.5" dominant-baseline="central">1 tsp</text>
<rect class="mat" x="51.5" y="205.0" width="285.7" height="29.0"/>
<text x="59.5" y="219.5" dominant-baseline="central">Baking powder</text>
<rect class="mat" x="0.0" y="234.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="248.5" dominant-baseline="central">pinch</text>
<rect class="mat" x="51.5" y="234.0" width="285.7" height="29.0"/>
<text x="59.5" y="248.5" dominant-baseline="central">Salt</text>
<rect class="mat" x="0.0" y="263.0" width="51.5" height="29.0"/>
<text class="amt" x="8.0" y="277.5" dominant-baseline="central">40 g</text>
<rect class="mat" x="51.5" y="263.0" width="424.7" height="29.0"/>
<text x="59.5" y="277.5" dominant-baseline="central">Dark chocolate chips</text>
<rect class="act" x="233.6" y="31.0" width="103.5" height="29.0"/>
<text x="241.6" y="45.5" dominant-baseline="central">Blend to flour</text>
<rect class="act" x="337.1" y="31.0" width="139.0" height="232.0"/>
<text x="345.1" y="147.0" dominant-baseline="central">Blend until smooth</text>
<rect class="act" x="476.1" y="31.0" width="254.2" height="261.0"/>
<text x="484.1" y="161.5" dominant-baseline="central">Fold in, save a few chips for the top</text>
<rect class="act" x="730.4" y="31.0" width="199.9" height="261.0"/>
<text x="738.4" y="136.0" dominant-baseline="central">Spread in lined 20 cm tin</text>
<text x="738.4" y="153.0" dominant-baseline="central">Bake 180 °C fan 16–20 min,</text>
<text x="738.4" y="170.0" dominant-baseline="central">moist crumbs on a skewer</text>
<text x="738.4" y="187.0" dominant-baseline="central">Cool, chill, slice into 9</text>
<rect class="edge" x="0.75" y="0.75" width="928.8" height="290.5"/>
</svg>
